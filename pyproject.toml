[project]
name = "needle"
version = "0.1.0"
description = "Needle • The Sharp, Minimal Developer SDK for Textile Yarns and Agents"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "themazyworlds", email = "meerahemant9086@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.0.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.14"
pythonPlatform = "Linux"

[tool.ruff]
line-length = 120
target-version = "py314"
